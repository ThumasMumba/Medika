<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Medika AI - Clinical Health Assistant</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Outfit:wght@500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      .clinical-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow:
          0 1px 3px 0 rgba(0, 0, 0, 0.1),
          0 1px 2px 0 rgba(0, 0, 0, 0.06);
      }
      .inner-shadow-sm {
        box-shadow: inset 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      }
      .typing-dot {
        width: 4px;
        height: 4px;
        background: currentColor;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-4px);
        }
      }
      .chat-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .chat-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .chat-scroll::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#2563eb",
              "primary-container": "#eff6ff",
              "on-primary-container": "#1e40af",
              secondary: "#0ea5e9",
              "secondary-container": "#f0f9ff",
              tertiary: "#10b981",
              background: "#f8fafc",
              surface: "#ffffff",
              "on-surface": "#1e293b",
              "on-surface-variant": "#64748b",
              outline: "#e2e8f0",
              "outline-variant": "#cbd5e1",
              error: "#ef4444",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              full: "9999px",
            },
            spacing: {
              "margin-mobile": "16px",
              "margin-desktop": "48px",
              sm: "12px",
              md: "24px",
              xl: "64px",
              xs: "4px",
              gutter: "24px",
              lg: "40px",
              base: "8px",
            },
            fontFamily: {
              "body-lg": ["Inter"],
              caption: ["Inter"],
              "label-md": ["Inter"],
              "headline-md": ["Outfit"],
              "headline-lg": ["Outfit"],
              "body-md": ["Inter"],
              "headline-lg-mobile": ["Outfit"],
              "display-lg": ["Outfit"],
            },
            fontSize: {
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              caption: ["12px", { lineHeight: "16px", fontWeight: "400" }],
              "label-md": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "500" },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-lg-mobile": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "display-lg": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-surface selection:bg-primary/10 selection:text-primary"
  >
    <!-- TopAppBar -->
    <header
      class="fixed top-0 left-0 w-full z-50 bg-surface/95 backdrop-blur-md border-b border-outline flex justify-between items-center px-4 md:px-margin-desktop h-20 shadow-sm"
    >
      <div class="flex items-center gap-4">
        <button
          class="p-2 hover:bg-slate-100 rounded-full transition-colors active:scale-95 duration-200 text-on-surface-variant"

        <a href={{url_for('patient_dashboard')}}>
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        </button>
        <div class="relative">
          <div

          >
            <img

            />
          </div>
          <div
            class="absolute bottom-0 right-0 w-3 h-3 bg-tertiary rounded-full border-2 border-surface"
          ></div>
        </div>
        <div>
          <h1
            class="font-headline-md text-[20px] font-bold tracking-tight text-primary leading-tight"
          >
            Medika AI
          </h1>
          <p
            class="font-caption text-caption text-on-surface-variant flex items-center gap-1.5"
          >
            <span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>
            Analyzing Vitals
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button
          class="hidden md:flex items-center gap-2 px-4 py-2 rounded-xl bg-background border border-outline text-on-surface-variant hover:bg-slate-50 transition-all"
        >
          <span class="material-symbols-outlined text-[20px]">history</span>
          <span class="font-label-md text-label-md">Past Sessions</span>
        </button>
        <button
          class="p-2 hover:bg-slate-100 rounded-full transition-colors active:scale-95 duration-200 text-on-surface-variant"
        >
          <span class="material-symbols-outlined">more_vert</span>
        </button>
      </div>
    </header>
    <!-- Main Content Canvas -->
    <main
      class="pt-24 pb-48 px-margin-mobile md:px-0 max-w-4xl mx-auto min-h-screen flex flex-col"
    >
      <!-- Chat Feed -->
      <div
        class="flex-1 space-y-6 flex flex-col chat-scroll overflow-y-auto pr-2"
        id="chat-feed"
      >
        <!-- AI Message 1 -->
        <div
          class="flex flex-col gap-2 max-w-[85%] md:max-w-[70%] self-start animate-fade-in"
        >
          <div
            class="clinical-card p-4 rounded-2xl rounded-tl-none text-on-surface"
          >
            <p class="font-body-md text-body-md">
              Welcome back, {{session['first_name']}}. How are you feeling today?.
            </p>
          </div>
          <span class="font-caption text-caption text-on-surface-variant px-1"
            >Medika AI • Just now</span
          >
        </div>
        <!-- User Message 1 -->
        <div class="flex flex-col gap-2 max-w-[85%] md:max-w-[70%] self-end">
          <div
            class="bg-primary p-4 rounded-2xl rounded-tr-none shadow-md text-white"
          >
          <label for="user-message"></label>
            <input type="text" id="user-message" class="font-body-md text-body-md color-white bg-transparent border-none focus:outline-none" placeholder="Type your message..." />
          </div>
        </div>
        <!-- Typing Indicator -->
        <div class="hidden flex flex-col gap-2 self-start" id="ai-typing">
          <div
            class="clinical-card px-4 py-3 rounded-2xl rounded-tl-none flex gap-1 items-center text-primary"
          >
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>
    </main>
    <!-- Bottom Interface -->
    <div
      class="fixed bottom-0 left-0 w-full z-50 bg-white border-t border-outline"
    >

    {# #}
      <!-- Input Bar -->
      <div class="pb-safe">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center gap-3">
         {#  <button
            class="p-3 text-on-surface-variant hover:text-primary transition-colors"
          >
            <span class="material-symbols-outlined">attach_file</span>
          </button> #}
          <div class="flex-1 relative">
            <input
              class="w-full bg-slate-50 border border-outline rounded-2xl py-3.5 px-5 text-on-surface placeholder:text-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all"
              id="chat-input"
              placeholder="Ask anything about your health..."
              type="text"
            />
            {#  <button
              class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-on-surface-variant hover:text-primary"
            >
              <span class="material-symbols-outlined">mic</span>
            </button> #}
          </div>
          <button
            class="p-4 bg-primary rounded-2xl text-white font-bold shadow-md hover:bg-blue-700 active:scale-90 transition-all"
            id="send-btn"
            onclick="handleSendMessage()"
          >
            <span class="material-symbols-outlined">send</span>
          </button>
        </div>
      </div>
    </div>
    <script>
      const chatFeed = document.getElementById("chat-feed");
      const chatInput = document.getElementById("chat-input");
      const aiTyping = document.getElementById("ai-typing");

      function scrollChat() {
        chatFeed.scrollTo({
          top: chatFeed.scrollHeight,
          behavior: "smooth",
        });
      }

      function createMessage(text, isUser = false) {
        const container = document.createElement("div");
        container.className = `flex flex-col gap-2 max-w-[85%] md:max-w-[70%] ${isUser ? "self-end" : "self-start"} animate-fade-in`;

        const inner = document.createElement("div");
        inner.className = isUser
          ? "bg-primary p-4 rounded-2xl rounded-tr-none shadow-md text-white"
          : "clinical-card p-4 rounded-2xl rounded-tl-none text-on-surface";

        const content = document.createElement("p");
        content.className = "font-body-md text-body-md";
        content.innerText = text;

        const meta = document.createElement("span");
        meta.className = `font-caption text-caption text-on-surface-variant px-1 ${isUser ? "self-end" : ""}`;
        meta.innerText = isUser ? "You • Just now" : "Medika AI • Just now";

        inner.appendChild(content);
        container.appendChild(inner);
        container.appendChild(meta);

        return container;
      }

      function handleSendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        chatFeed.insertBefore(createMessage(text, true), aiTyping);
        chatInput.value = "";
        scrollChat();

        showTyping(true);

       showTyping(true);

fetch("/diagnose", {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
  },
  body: JSON.stringify({
    symptoms: text,
  }),
})
  .then((response) => response.json())
  .then((data) => {
    showTyping(false);

    let responseText = "";

    if (data.error) {
      responseText = data.error;
    } else {
      responseText =
        `Condition: ${data.disease}\n\n` +
        `Confidence: ${(data.confidence * 100).toFixed(1)}%\n\n` +
        `Advice: ${data.advice}`;

      if (data.precautions && data.precautions.length > 0) {
        responseText +=
          "\n\nPrecautions:\n• " +
          data.precautions.join("\n• ");
      }

      if (data.refer) {
        responseText +=
          "\n\n⚠ Professional medical attention is recommended.";
      }
    }

    chatFeed.insertBefore(createMessage(responseText), aiTyping);
    scrollChat();
  })
  .catch((error) => {
    console.error(error);

    showTyping(false);

    chatFeed.insertBefore(
      createMessage(
        "Unable to connect to the Medika AI service. Please try again."
      ),
      aiTyping
    );

    scrollChat();
  });}

      function sendQuickMessage(label) {
        chatInput.value = label;
        handleSendMessage();
      }

      function showTyping(show) {
        if (show) {
          aiTyping.classList.remove("hidden");
        } else {
          aiTyping.classList.add("hidden");
        }
        scrollChat();
      }

      chatInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSendMessage();
      });

      window.addEventListener("load", scrollChat);
    </script>
  </body>
</html>
