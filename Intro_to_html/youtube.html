<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youtube.com-clone</title>
    <style>
      .thumbnail {
        width: 300px;
        display: block;
      }
      .img-preview {
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-left: 10px;
      }
      .profile-pic {
        width: 30px;
        height: 30px;
        border-radius: 600px;
        margin-top: 10px;
        display: inline-block;
      }
      .thumbnail-1 {
        width: 300px;
        display: block;
      }
      .search-bar {
        display: block;
      }
      .views {
        display: inline-block;
      }
      .video-info {
        display: inline-block;
        width: 260px;
        margin-top: 0px;
      }
    </style>
  </head>
  <body>
    <input class="search-bar" type="text" placeholder="Search" />

    <div class="img-preview">
      <div>
        <img class="thumbnail" src="thumbnails/thumbnail.jpg" alt="Cadillac" />
      </div>

      <div>
        <img
          class="profile-pic"
          src="channel-pic/thumbnail-2.jpg"
          alt="profile picture"
        />
        <p class="video-info">Talking Tech AI with Google CEO Sundar Pichai!</p>
        <p class="views">3.8M views &#183; 6 months ago</p>
      </div>
    </div>

    <div class="img-preview">
      <img
        class="thumbnail-1"
        src="thumbnails/thumbnail-1.jpg"
        alt="Cadillac"
      />
      <p class="video-info">
        Dodge challenger dark-scat Talking Tech AI cars manufacturers!
      </p>
      <p class="views">3.4M views &#183; 6 months ago</p>
    </div>
  </body>
</html>
