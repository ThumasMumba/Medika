<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .name {
        border-radius: 8px;
        border-width: 1px;
        padding-left: 12px;
        padding-bottom: 5px;
        padding-top: 5px;
        border-style: block;
      }
      .last-name {
        border-radius: 8px;
        border-width: 1px;
        padding-left: 12px;
        padding-bottom: 5px;
        padding-top: 5px;
        border-style: block;
      }
      .e-mail {
        border-radius: 8px;
        border-width: 1px;
        padding-left: 12px;
        padding-bottom: 5px;
        padding-top: 5px;
        border-style: block;
        margin-top: 10px;
        width: 359px;
        display: block;
      }
      .sign-up {
        background-color: rgb(0, 110, 255);
        color: white;
        border-radius: 8px;
        width: 377px;
        padding-left: 20px;
        padding-bottom: 10px;
        padding-top: 10px;
        margin-top: 10px;
        border: none;
        cursor: pointer;
        transition: background-color 1s, color 1s;
      }
      .sign-up:hover {
        background-color: blue;
        color: white;
      }
      .sign-up:active {
        opacity: 0.7;
      }
    </style>
  </head>
  <body class="body">
    <input class="name" type="text" placeholder="First name" />
    <input class="last-name" type="text" placeholder="Last name" />
    <input class="e-mail" type="text" placeholder="Email" />
    <button class="sign-up">sign up</button>
  </body>
</html>
