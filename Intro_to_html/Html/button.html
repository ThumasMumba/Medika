<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Practice</title>
    <link rel="stylesheet" href="css/buttons.css" />
  </head>
  <body>
    <button class="subscribe-button">SUBSCRIBE</button>

    <button class="join-button">Join my Whatsapp group</button>

    <button class="twitter-button">Tweet</button>

    <button class="uber-button">Request now</button>
    <button class="amazon-button">Add to Cart</button>
    <button class="git-btn">Sign up</button>

    <button class="bootstrap-btn">
      <span class="left">Get started</span>
      <span class="right">Download</span>
    </button>
  </body>
</html>
